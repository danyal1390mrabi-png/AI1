#newBtn{background:var(--acc);color:#fff;padding:10px;border-radius:12px;font-weight:500}
#newBtn:hover{background:var(--acc2)}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.sec{font-size:12px;color:var(--mut);padding:8px 8px 4px}
.item{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;font-size:14px}
.item:hover,.item.on{background:var(--user)}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.item .del{opacity:0;color:var(--mut);font-size:16px}
.item:hover .del{opacity:1}
.foot{display:flex;gap:8px}
.foot button,.foot a{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);font-size:13px}
.foot a{display:block;text-align:center;text-decoration:none;color:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);font-size:13px}
.foot button:hover,.foot a:hover{background:var(--user)}
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
#menu{display:none;font-size:22px;padding:2px 8px}
header b{font-size:15px}
#chat{flex:1;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:10px 16px 20px}
.wrap{max-width:760px;margin:0 auto}
.welcome{text-align:center;padding-top:8vh}
.welcome .logo{width:84px;height:84px;border-radius:22px;margin:0 auto 18px}
.welcome h1{font-size:28px;font-weight:500;margin-bottom:6px}
.welcome p{color:var(--mut)}
.sug{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px}
.sug button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:right;font-size:14px;line-height:1.7}
.sug button:hover{border-color:var(--acc)}
.msg{display:flex;gap:12px;margin:18px 0;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.msg.user{justify-content:flex-start}
.msg.user .bub{background:var(--user);padding:10px 16px;border-radius:18px;max-width:85%;white-space:pre-wrap}
.msg.ai .av{width:30px;height:30px;border-radius:9px;overflow:hidden;flex:none;margin-top:2px}
.msg.ai .bub{flex:1;min-width:0;line-height:2}
.bub p{margin:.4em 0}
.bub ul,.bub ol{padding-right:22px;margin:.4em 0}
.bub h1,.bub h2,.bub h3{margin:.8em 0 .3em;font-size:1.1em}
.bub a{color:var(--acc)}
.bub code{background:var(--user);padding:1px 6px;border-radius:6px;font-family:Consolas,monospace;font-size:.9em;direction:ltr;unicode-bidi:embed}
.codebox{direction:ltr;text-align:left;background:var(--code);border-radius:12px;margin:10px 0;overflow:hidden}
.codebox .top{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#00000040;color:#aaa;font-size:12px;font-family:Consolas,monospace}
.codebox .top button{color:#ccc;font-size:12px;font-family:Vazirmatn,sans-serif}
.codebox pre{padding:12px 14px;overflow:auto;color:#e6e6e6;font-family:Consolas,monospace;font-size:13px;line-height:1.6}
.codebox code{background:none;padding:0;font-size:inherit}
.acts{display:flex;gap:4px;margin-top:6px}
.acts button{font-size:12px;color:var(--mut);padding:4px 8px;border-radius:8px}
.acts button:hover{background:var(--user);color:var(--text)}

<style id="three-d">
/* ================= 3D THEME (لایه‌ی سه‌بعدی) ================= */
:root{--bg:#eaf1ff;--side:#f4f7ff;--card:#ffffff;--text:#0f1b3a;--mut:#5b6b8f;--line:#cfdcf7;--acc:#2f7bff;--acc2:#1f5fe0;--user:#dfe9ff;--code:#0b1426;
  --glass:rgba(255,255,255,.66);--edge:#1b4fb8;--glow:rgba(47,123,255,.38);--g1:rgba(47,123,255,.20);
  --ext:0 1px 0 #bcd0ff,0 2px 0 #a9c1fb,0 3px 0 #96b2f7,0 12px 22px rgba(47,123,255,.30)}
:root[data-theme=dark]{--bg:#0a1226;--side:#0d1730;--card:#13213f;--text:#e8efff;--mut:#93a4cc;--line:#233560;--acc:#3aa0ff;--acc2:#2a85e6;--user:#1a2a52;--code:#070d1c;
  --glass:rgba(16,28,56,.66);--edge:#1c63ad;--glow:rgba(58,160,255,.45);--g1:rgba(58,160,255,.18);
  --ext:0 1px 0 #1b3a73,0 2px 0 #163260,0 3px 0 #11284e,0 12px 26px rgba(58,160,255,.45)}
body{background:radial-gradient(1100px 650px at 30% 8%,var(--g1),transparent 62%),radial-gradient(900px 600px at 85% 95%,var(--g1),transparent 60%),var(--bg)}
#bg3d{position:fixed;inset:0;z-index:-1;pointer-events:none;display:block}

/* پنل‌های شیشه‌ای */
#side{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);box-shadow:inset -1px 0 0 rgba(255,255,255,.08),-12px 0 40px rgba(0,0,0,.12)}
header{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.08)}
#list{perspective:700px}
.item{transition:transform .2s,background .2s,box-shadow .2s;transform-origin:right center}
.item:hover,.item.on{transform:translateZ(16px) rotateY(-5deg);box-shadow:0 8px 18px rgba(0,0,0,.18)}

/* لوگو و برند */
.brand .logo{box-shadow:0 3px 0 var(--edge),0 8px 16px var(--glow);transition:transform .3s}
.brand .logo:hover{transform:perspective(300px) rotateY(180deg)}
.foot button,.foot a{box-shadow:0 3px 0 var(--line);background:var(--glass);transition:transform .12s,box-shadow .12s,background .2s}
.foot button:active,.foot a:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}

/* دکمه‌های سه‌بعدی (فشرده‌شدنی) */
#newBtn,#send{background:linear-gradient(160deg,var(--acc),var(--acc2));box-shadow:0 5px 0 var(--edge),0 12px 22px var(--glow);transition:transform .12s,box-shadow .12s,filter .2s}
#newBtn:hover,#send:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 7px 0 var(--edge),0 16px 26px var(--glow)}
#newBtn:active,#send:active{transform:translateY(5px);box-shadow:0 0 0 var(--edge),0 4px 8px var(--glow)}
.modes button{box-shadow:0 3px 0 var(--line);background:var(--glass);transition:transform .12s,box-shadow .12s,background .2s}
.modes button:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--line)}
.modes button:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.modes button.on{background:linear-gradient(160deg,var(--acc),var(--acc2));box-shadow:0 3px 0 var(--edge),0 8px 16px var(--glow)}

/* صفحه‌ی خوش‌آمد: لوگوی شناور و عنوان برجسته */
.welcome{perspective:1000px}
.welcome .logo{width:116px;height:116px;border-radius:30px;margin:0 auto 26px;transform-style:preserve-3d;
  transform:perspective(700px) rotateY(calc(var(--px,0)*24deg)) rotateX(calc(var(--py,0)*-18deg));
  transition:transform .12s linear;animation:bob 5s ease-in-out infinite;
  box-shadow:0 0 0 1px rgba(255,255,255,.2),0 4px 0 rgba(255,255,255,.12) inset,0 26px 50px var(--glow),0 40px 60px rgba(0,0,0,.28)}
@keyframes bob{50%{translate:0 -12px}}
.welcome h1{text-shadow:var(--ext),0 0 22px var(--bg);transform:translateZ(30px)}
.welcome p{text-shadow:0 0 14px var(--bg),0 0 14px var(--bg),0 2px 12px rgba(0,0,0,.12)}
.sug{perspective:900px}
.sug button{--rx:0deg;--ry:0deg;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),var(--glow),transparent 62%),var(--glass);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transform:perspective(700px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .15s ease-out,border-color .2s,box-shadow .2s;
  box-shadow:0 6px 0 var(--line),0 14px 26px rgba(0,0,0,.14)}
.sug button:hover{border-color:var(--acc);box-shadow:0 8px 0 var(--edge),0 22px 36px var(--glow);translate:0 -4px}
.sug button:active{translate:0 2px;box-shadow:0 2px 0 var(--edge)}

/* پیام‌ها: ورود با چرخش سه‌بعدی و عمق */
.wrap{perspective:1100px;perspective-origin:50% 0}
.msg{transform-origin:50% 0;transform-style:preserve-3d;animation:in3d .55s cubic-bezier(.2,.8,.2,1)}
@keyframes in3d{from{opacity:0;transform:rotateX(-38deg) translateY(26px) translateZ(-90px)}}
.msg.user .bub{background:linear-gradient(150deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 0 var(--edge),0 14px 26px var(--glow);transition:transform .2s,box-shadow .2s}
.msg.user .bub:hover{transform:translateZ(14px) translateY(-2px);box-shadow:0 6px 0 var(--edge),0 22px 34px var(--glow)}
.msg.ai .av{box-shadow:0 3px 0 var(--edge),0 10px 18px var(--glow);animation:bob 6s ease-in-out infinite}
.msg.ai .bub{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:6px 18px;
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 4px 0 var(--line),0 16px 34px rgba(0,0,0,.16);transition:transform .2s,box-shadow .2s}
.msg.ai .bub:hover{transform:translateZ(10px) translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 6px 0 var(--line),0 24px 44px rgba(0,0,0,.2)}
.codebox{box-shadow:0 0 0 1px rgba(255,255,255,.07),0 6px 0 rgba(0,0,0,.35),0 18px 34px rgba(0,0,0,.4)}
img.gen{box-shadow:0 6px 0 var(--line),0 24px 44px rgba(0,0,0,.35);transition:transform .25s}
img.gen:hover{transform:perspective(800px) rotateX(3deg) rotateY(-4deg) translateZ(12px)}

/* نوار ورودی */
.box{background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:transform .25s,box-shadow .25s,border-color .2s;
  box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 6px 0 var(--line),0 20px 40px rgba(0,0,0,.18)}
.box:focus-within{transform:translateY(-4px);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 8px 0 var(--edge),0 26px 50px var(--glow)}
#attach{transition:transform .12s}#attach:active{transform:translateY(2px)}

/* کارت ورود/ثبت‌نام */
#authOv{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);perspective:1000px}
.acard{animation:cardIn .8s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 8px 0 var(--line),0 36px 70px rgba(0,0,0,.35)}
@keyframes cardIn{from{opacity:0;transform:rotateX(28deg) translateY(50px) translateZ(-120px) scale(.9)}}
.acard .alogo{animation:bob 5s ease-in-out infinite;box-shadow:0 22px 44px var(--glow),0 0 0 1px rgba(255,255,255,.15)}
.abtn{background:linear-gradient(160deg,var(--acc),var(--acc2));box-shadow:0 5px 0 var(--edge),0 12px 22px var(--glow);transition:transform .12s,box-shadow .12s}
.abtn:hover{background:linear-gradient(160deg,var(--acc),var(--acc2));filter:brightness(1.08)}
.abtn:active{transform:translateY(5px);box-shadow:0 0 0 var(--edge)}

/* موبایل: سبک‌تر */
@media(max-width:800px){
  .welcome .logo{width:96px;height:96px}
  .msg.ai .bub{padding:4px 14px}
  .item:hover,.item.on{transform:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<script>
// ====== تنظیمات ======
const API_URL = "https://apis.danyalcode.ir/";   // آدرس Worker شما
const AUTH_URL = "https://apiw.danyalcode.ir";     // API ثبت‌نام و ورود
const SYSTEM = "تو «دانیال کد» هستی، یک دستیار هوش مصنوعی فارسی‌زبان و مفید. پاسخ‌ها را واضح و دقیق بده و برای کد از بلاک کد استفاده کن.";
// ======================

const $=s=>document.querySelector(s);
const msgsEl=$('#msgs'),chatEl=$('#chat'),inp=$('#inp'),sendBtn=$('#send');
let chats=load('dc_chats',[]),cur=null,busy=false,ctrl=null;
const SUGS=["یک صفحه لندینگ زیبا با HTML و CSS بنویس","تفاوت let و const و var در جاوااسکریپت چیست؟","به من کمک کن یک ایمیل رسمی بنویسم","الگوریتم مرتب‌سازی سریع را ساده توضیح بده"];

function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}
function save(){try{localStorage.setItem('dc_chats',JSON.stringify(chats))}catch{}}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function md(t){
  const blocks=[];
  t=t.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(_,l,c)=>{blocks.push(`<div class="codebox"><div class="top"><span>${l||'code'}</span><button onclick="copyCode(this)">کپی</button></div><pre><code>${esc(c.replace(/\n$/,''))}</code></pre></div>`);return `\u0000${blocks.length-1}\u0000`});
  t=esc(t);
  t=t.replace(/`([^`\n]+)`/g,'<code>$1</code>')
     .replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
     .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>')
     .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
     .replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>');
  t=t.replace(/(?:^[-*] .+(?:\n|$))+/gm,m=>'<ul>'+m.trim().split('\n').map(x=>'<li>'+x.replace(/^[-*] /,'')+'</li>').join('')+'</ul>')
     .replace(/(?:^\d+[.)] .+(?:\n|$))+/gm,m=>'<ol>'+m.trim().split('\n').map(x=>'<li>'+x.replace(/^\d+[.)] /,'')+'</li>').join('')+'</ol>');
  t=t.split(/\n{2,}/).map(p=>/^<(ul|ol|h\d)/.test(p.trim())||/^\u0000\d+\u0000$/.test(p.trim())?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
  return t.replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[i]);
}
window.copyCode=b=>{navigator.clipboard.writeText(b.closest('.codebox').querySelector('code').innerText);b.textContent='کپی شد ✓';setTimeout(()=>b.textContent='کپی',1500)};

function renderList(){
  const l=$('#list');l.innerHTML='<div class="sec">گفتگوهای اخیر</div>';
  chats.forEach(c=>{
    const d=document.createElement('div');d.className='item'+(c.id===cur?' on':'');
    d.innerHTML=`<span>${esc(c.title)}</span><button class="del" title="حذف">✕</button>`;
    d.querySelector('span').onclick=()=>{open(c.id);closeSide()};
    d.querySelector('.del').onclick=()=>{chats=chats.filter(x=>x.id!==c.id);save();if(cur===c.id)newChat();else renderList()};
    l.appendChild(d);
  });
}
function newChat(){cur=null;msgsEl.innerHTML='';welcome();renderList();closeSide();inp.focus()}
function welcome(){
  msgsEl.innerHTML=`<div class="welcome"><div class="logo"></div><h1>سلام! من دانیال کد هستم 👋</h1><p>چطور می‌توانم کمکت کنم؟</p><div class="sug">${SUGS.map(s=>`<button>${esc(s)}</button>`).join('')}</div></div>`;
  msgsEl.querySelectorAll('.sug button').forEach(b=>b.onclick=()=>{inp.value=b.textContent;send()});
}
function open(id){
  cur=id;msgsEl.innerHTML='';const c=chats.find(x=>x.id===id);
  c.msgs.forEach(m=>addMsg(m.role,m.content));renderList();scrollEnd();
}
function addMsg(role,text){
  const w=document.createElement('div');w.className='msg '+(role==='user'?'user':'ai');
  if(role==='user'){w.innerHTML='<div class="bub"></div>';w.firstChild.textContent=text}
  else{
    w.innerHTML='<div class="av"></div><div class="bub"><div class="body"></div><div class="acts"><button data-a="copy">📋 کپی</button><button data-a="re">🔄 تولید دوباره</button></div></div>';
    w.querySelector('.body').innerHTML=text?md(text):'<div class="dots"><span></span><span></span><span></span></div>';
    w.querySelector('[data-a=copy]').onclick=e=>{navigator.clipboard.writeText(w.querySelector('.body').innerText);e.target.textContent='✓ کپی شد';setTimeout(()=>e.target.textContent='📋 کپی',1500)};
    w.querySelector('[data-a=re]').onclick=regen;
  }
  msgsEl.appendChild(w);return w;
}
function scrollEnd(){chatEl.scrollTop=chatEl.scrollHeight}
function setBusy(b){busy=b;sendBtn.textContent=b?'■':'➤';sendBtn.disabled=false}

let mode='auto',attached=null;
const J={'Content-Type':'application/json'};
const hist=c=>c.msgs.map(m=>({role:m.role,content:m.content}));
function setMode(m){mode=m;document.querySelectorAll('.modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));inp.placeholder=m==='image'?'تصویر مورد نظرت را توصیف کن...':m==='research'?'موضوع تحقیق را بنویس...':m==='auto'?'هر چیزی بخواه؛ خودم تصمیم می‌گیرم (چت، تحقیق یا عکس)...':'از دانیال کد بپرس...'}
function clearAttach(){attached=null;$('#chip').style.display='none';$('#fi').value=''}

async function ask(c,aiEl,o={}){
  ctrl=new AbortController();setBusy(true);
  const sig=ctrl.signal,body=aiEl.querySelector('.body');let full='';
  try{
    if(o.mode==='image'){
      const r=await fetch(API_URL,{method:'POST',headers:J,signal:sig,body:JSON.stringify({action:'image',prompt:o.prompt})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.dataURI)throw new Error(j.error||'ساخت تصویر ممکن نشد');
      body.innerHTML='<img class="gen" alt="">';body.firstChild.src=j.dataURI;
      full='🎨 تصویر ساخته شد: '+o.prompt;
    }else if(o.mode==='research'){
      const r=await fetch(API_URL,{method:'POST',headers:J,signal:sig,body:JSON.stringify({action:'research',q:o.prompt})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(j.error||'تحقیق ممکن نشد');
      const L=(j.results||[]).slice(0,8);
      full=L.length?'نتایج تحقیق برای «'+o.prompt+'»:\n\n'+L.map((x,i)=>`${i+1}. [${(x.title||x.link).replace(/[\[\]]/g,'')}](${x.link}) ${x.snippet?'— '+x.snippet:''}`).join('\n'):'نتیجه‌ای پیدا نشد.';
      body.innerHTML=md(full);
    }else if(o.file){
      const f=o.file,fd=new FormData();
      fd.append('action','chat');
      fd.append('messages',JSON.stringify([...hist(c).slice(0,-1),{role:'user',content:o.clean}]));
      fd.append(f.type.startsWith('image/')?'image':'file',f);
      const r=await fetch(API_URL,{method:'POST',signal:sig,body:fd});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.response)throw new Error(j.error||'پردازش فایل ممکن نشد');
      full=typeof j.response==='string'?j.response:JSON.stringify(j.response);
      body.innerHTML=md(full);
    }else{
      const r=await fetch(API_URL,{method:'POST',headers:J,signal:sig,body:JSON.stringify({action:'chat',stream:true,noauto:o.mode==='chat',messages:[{role:'system',content:SYSTEM},...hist(c)]})});
      if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||'HTTP '+r.status)}
      if((r.headers.get('content-type')||'').includes('application/json')){
        // حالت خودکار: Worker تصمیم گرفته تصویر بسازد (یا پاسخ JSON داده)
        const j=await r.json().catch(()=>({}));
        if(j.dataURI){body.innerHTML='<img class="gen" alt="">';body.firstChild.src=j.dataURI;full='🎨 تصویر ساخته شد'+(j.prompt_used?': '+j.prompt_used:'')}
        else if(j.response){full=j.response;body.innerHTML=md(full)}
        else throw new Error(j.error||'پاسخ خالی');
      }else{
      const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
      while(true){
        const {done,value}=await rd.read();if(done)break;
        buf+=dec.decode(value,{stream:true});
        const ls=buf.split('\n');buf=ls.pop();
        for(const l of ls){
          if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d==='[DONE]')continue;
          try{full+=JSON.parse(d).response||''}catch{}
        }
        body.innerHTML=md(full);scrollEnd();
      }
      if(!full)throw new Error('پاسخ خالی');
      }
    }
  }catch(e){
    if(e.name==='AbortError'){body.innerHTML=full?md(full):'<i>متوقف شد.</i>'}
    else{full='⚠️ '+e.message;body.innerHTML=md(full)}
  }
  if(full&&!full.startsWith('⚠️'))c.msgs.push({role:'assistant',content:full});
  save();setBusy(false);scrollEnd();
}
async function send(){
  if(busy){ctrl&&ctrl.abort();return}
  const t=inp.value.trim(),m=mode,a=attached;
  if(!t&&!a)return;if(m!=='chat'&&m!=='auto'&&!t)return;
  inp.value='';inp.style.height='auto';clearAttach();setMode('auto');
  let c=chats.find(x=>x.id===cur);
  if(!c){c={id:Date.now(),title:(t||a.name).slice(0,40),msgs:[]};chats.unshift(c);cur=c.id;msgsEl.innerHTML='';renderList()}
  const shown=(a?'📎 '+a.name+'\n':'')+t;
  c.msgs.push({role:'user',content:shown});addMsg('user',shown);
  const ai=addMsg('assistant','');scrollEnd();save();
  await ask(c,ai,{mode:m,prompt:t,file:a,clean:t||'این فایل را بررسی و خلاصه کن.'});
}
function regen(){
  if(busy)return;const c=chats.find(x=>x.id===cur);if(!c)return;
  if(c.msgs.at(-1)?.role==='assistant')c.msgs.pop();
  open(cur);msgsEl.lastChild.remove();
  const ai=addMsg('assistant','');scrollEnd();ask(c,ai);
}
function closeSide(){$('#side').classList.remove('open');$('#ov').classList.remove('open')}

sendBtn.onclick=send;
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$('#attach').onclick=()=>$('#fi').click();
$('#cx').onclick=clearAttach;
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;
  const lim=f.type.startsWith('image/')?6:8;
  if(f.size>lim*1048576){alert('حجم فایل بیش از '+lim+' مگابایت است');e.target.value='';return}
  attached=f;$('#cn').textContent='📎 '+f.name;$('#chip').style.display='block'};
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();send()}});
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,200)+'px'});
inp.addEventListener('input',()=>{inp.dir=/[\u0600-\u06FF]/.test(inp.value[0]||'ا')?'rtl':'ltr'});
$('#newBtn').onclick=newChat;
$('#menu').onclick=()=>{$('#side').classList.add('open');$('#ov').classList.add('open')};
$('#ov').onclick=closeSide;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSide()});
$('#clear').onclick=()=>{if(confirm('همه گفتگوها پاک شود؟')){chats=[];save();newChat()}};
$('#theme').onclick=()=>{const d=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d;try{localStorage.setItem('dc_theme',d)}catch{}};
try{document.documentElement.dataset.theme=localStorage.getItem('dc_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch{}

// ====== ثبت‌نام / ورود ======
const LS_TOKEN='danyalcode_ai_session_token',LS_USER='danyalcode_ai_session_username';
const authOv=$('#authOv');
function showLogin(){$('#aReg').style.display='none';$('#aLogin').style.display='block';$('#lErr').textContent=''}
function showReg(){$('#aLogin').style.display='none';$('#aReg').style.display='block';$('#rErr').textContent=''}
const validUser=u=>/^[a-zA-Z0-9_.-]{3,32}$/.test(u);
function startApp(){authOv.classList.remove('on');newChat()}
async function checkSession(t){
  try{const r=await fetch(AUTH_URL+'/me',{headers:{Authorization:'Bearer '+t}});if(!r.ok)return false;const j=await r.json();return !!j.ok}catch{return false}
}
async function authCall(path,username,password,btn,errEl,busyTxt,idleTxt){
  btn.disabled=true;btn.textContent=busyTxt;errEl.textContent='';
  try{
    const r=await fetch(AUTH_URL+path,{method:'POST',headers:J,body:JSON.stringify({username,password})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok){errEl.textContent=j.error||(path==='/login'?'نام کاربری یا رمز عبور اشتباه است.':'ثبت‌نام انجام نشد. شاید این نام کاربری قبلاً گرفته شده باشد.');return}
    try{localStorage.setItem(LS_TOKEN,j.token);localStorage.setItem(LS_USER,username)}catch{}
    startApp();
  }catch{errEl.textContent='اتصال به سرور برقرار نشد.'}
  finally{btn.disabled=false;btn.textContent=idleTxt}
}
function doLogin(){
  const u=$('#lUser').value.trim(),p=$('#lPass').value;
  if(!validUser(u)){$('#lErr').textContent='نام کاربری نامعتبر است.';return}
  if(!p){$('#lErr').textContent='رمز عبور را وارد کنید.';return}
  authCall('/login',u,p,$('#lBtn'),$('#lErr'),'در حال ورود...','ورود');
}
function doRegister(){
  const u=$('#rUser').value.trim(),p=$('#rPass').value,p2=$('#rPass2').value;
  if(!validUser(u)){$('#rErr').textContent='نام کاربری باید ۳ تا ۳۲ کاراکتر و شامل حروف انگلیسی، عدد، نقطه، خط تیره یا آندرلاین باشد.';return}
  if(p.length<6){$('#rErr').textContent='رمز عبور باید حداقل ۶ کاراکتر باشد.';return}
  if(p!==p2){$('#rErr').textContent='رمز عبور و تکرار آن یکسان نیستند.';return}
  authCall('/register',u,p,$('#rBtn'),$('#rErr'),'در حال ثبت‌نام...','ثبت‌نام');
}
$('#lBtn').onclick=doLogin;
$('#rBtn').onclick=doRegister;
$('#toReg').onclick=showReg;
$('#toLogin').onclick=showLogin;
$('#lUser').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lPass').focus()});
$('#lPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
$('#rPass2').addEventListener('keydown',e=>{if(e.key==='Enter')doRegister()});
$('#logout').onclick=()=>{
  try{localStorage.removeItem(LS_TOKEN);localStorage.removeItem(LS_USER)}catch{}
  closeSide();showLogin();authOv.classList.add('on');
};
(async function boot(){
  let t=null;try{t=localStorage.getItem(LS_TOKEN)}catch{}
  if(t&&await checkSession(t)){startApp();return}
  try{localStorage.removeItem(LS_TOKEN);localStorage.removeItem(LS_USER)}catch{}
  showLogin();authOv.classList.add('on');
})();
</script>

<script id="scene3d">
/* ====== صحنه‌ی سه‌بعدی پس‌زمینه (بدون کتابخانه) + تعامل سه‌بعدی رابط ====== */
(function(){
  const cv=document.getElementById('bg3d'); if(!cv) return;
  const ctx=cv.getContext('2d'); if(!ctx) return;
  const root=document.documentElement;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mobile=matchMedia('(max-width:800px)').matches||/Mobi|Android/i.test(navigator.userAgent);
  let W=0,H=0,DPR=1,cx=0,cy=0,R=0;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,mobile?1.25:1.75);
    W=innerWidth;H=innerHeight;
    cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
    cv.style.width=W+'px';cv.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    R=Math.min(W,H)*(mobile?0.30:0.27);
    cx=W>800?(W-272)/2:W/2; cy=H*0.40;
    if(reduce) draw(0);
  }

  // کره‌ی ذرات (فیبوناچی) + یال‌های نزدیک
  const N=mobile?90:170, pts=[];
  for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),th=i*2.399963;pts.push([Math.cos(th)*r,y,Math.sin(th)*r]);}
  const edges=[], TH=mobile?0.46:0.40;
  for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
    const dx=pts[i][0]-pts[j][0],dy=pts[i][1]-pts[j][1],dz=pts[i][2]-pts[j][2];
    if(dx*dx+dy*dy+dz*dz<TH*TH)edges.push([i,j]);
  }
  // پالس‌های داده روی یال‌ها
  const pulses=[];for(let i=0;i<(mobile?5:10);i++)pulses.push({e:Math.floor(Math.random()*edges.length),u:Math.random(),sp:.004+Math.random()*.006});
  // حلقه‌ی مداری
  const RING=72, ring=[];for(let i=0;i<RING;i++){const a=i/RING*Math.PI*2;ring.push([Math.cos(a)*1.5,0,Math.sin(a)*1.5]);}
  // غبار ستاره‌ای
  const stars=[];for(let i=0;i<(mobile?35:80);i++)stars.push([(Math.random()*2-1)*2.6,(Math.random()*2-1)*2.0,(Math.random()*2-1)*2.6,Math.random()]);

  let mx=0,my=0,smx=0,smy=0,ay=0;
  const D=3.2;
  function rot(p,ax,ayy){
    // چرخش حول Y سپس X
    let x=p[0]*Math.cos(ayy)+p[2]*Math.sin(ayy), z=-p[0]*Math.sin(ayy)+p[2]*Math.cos(ayy), y=p[1];
    const y2=y*Math.cos(ax)-z*Math.sin(ax), z2=y*Math.sin(ax)+z*Math.cos(ax);
    return [x,y2,z2];
  }
  function proj(q,scale){const s=D/(D+q[2]);return [cx+q[0]*R*s*(scale||1),cy+q[1]*R*s*(scale||1),s,q[2]];}

  let sp=new Array(N), sq=new Array(N);
  function draw(t){
    const dark=root.dataset.theme==='dark';
    const rgb=dark?'80,175,255':'38,105,225';
    const k=dark?1:0.62;
    ctx.globalCompositeOperation='source-over';
    ctx.clearRect(0,0,W,H);
    if(dark)ctx.globalCompositeOperation='lighter';

    // ---- کف شبکه‌ای با پرسپکتیو ----
    const hz=H*0.66, f=H*0.85, camH=1.15, speed=(t*0.00028)%1;
    ctx.lineWidth=1;
    for(let i=0;i<14;i++){
      const z=1+i+(1-speed); const y=hz+camH*f/z; if(y>H+2)continue;
      const a=Math.max(0,(1-i/14))*0.22*k;
      ctx.strokeStyle='rgba('+rgb+','+a.toFixed(3)+')';
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    }
    for(let i=-14;i<=14;i++){
      const x=i*1.1;
      const x1=cx+x*f/1.0, y1=hz+camH*f/1.0, x2=cx+x*f/16, y2=hz+camH*f/16;
      const g=ctx.createLinearGradient(0,y2,0,y1);
      g.addColorStop(0,'rgba('+rgb+',0)');g.addColorStop(1,'rgba('+rgb+','+(0.20*k).toFixed(3)+')');
      ctx.strokeStyle=g;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x1,y1);ctx.stroke();
    }

    // ---- زاویه‌ها ----
    smx+=(mx-smx)*0.05; smy+=(my-smy)*0.05;
    const ayy=ay+smx*0.7, ax=0.35+smy*0.35;

    // ---- ستاره‌ها ----
    for(const s of stars){
      const q=rot(s,ax*0.6,ayy*0.5), P=proj(q,1.0);
      const a=(0.15+0.5*(1-(q[2]+2.6)/5.2))*k;
      ctx.fillStyle='rgba('+rgb+','+a.toFixed(3)+')';
      ctx.beginPath();ctx.arc(P[0],P[1],0.6+P[2]*0.9,0,6.283);ctx.fill();
    }

    // ---- کره ----
    for(let i=0;i<N;i++){const q=rot(pts[i],ax,ayy);sq[i]=q;sp[i]=proj(q);}
    ctx.lineWidth=1;
    for(const e of edges){
      const a=sp[e[0]],b=sp[e[1]];
      const dep=1-((sq[e[0]][2]+sq[e[1]][2])/2+1)/2;       // نزدیک‌تر = روشن‌تر
      const al=(0.035+0.19*dep)*k;
      ctx.strokeStyle='rgba('+rgb+','+al.toFixed(3)+')';
      ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
    }
    for(let i=0;i<N;i++){
      const P=sp[i],dep=1-(sq[i][2]+1)/2;
      const al=(0.18+0.55*dep)*k;
      ctx.fillStyle='rgba('+rgb+','+al.toFixed(3)+')';
      ctx.beginPath();ctx.arc(P[0],P[1],0.8+2.1*dep*P[2],0,6.283);ctx.fill();
      if(dep>0.85){ctx.fillStyle='rgba('+rgb+','+(0.07*k).toFixed(3)+')';ctx.beginPath();ctx.arc(P[0],P[1],6,0,6.283);ctx.fill();}
    }
    // پالس‌ها
    for(const p of pulses){
      p.u+=p.sp; if(p.u>1){p.u=0;p.e=Math.floor(Math.random()*edges.length);}
      const e=edges[p.e],a=sp[e[0]],b=sp[e[1]];
      const x=a[0]+(b[0]-a[0])*p.u,y=a[1]+(b[1]-a[1])*p.u;
      ctx.fillStyle='rgba('+(dark?'190,235,255':'20,80,200')+','+(0.9*k).toFixed(3)+')';
      ctx.beginPath();ctx.arc(x,y,2.2,0,6.283);ctx.fill();
      ctx.fillStyle='rgba('+rgb+','+(0.18*k).toFixed(3)+')';
      ctx.beginPath();ctx.arc(x,y,7,0,6.283);ctx.fill();
    }

    // ---- حلقه‌ی مداری مایل ----
    const rax=ax+0.9, ray=-ayy*1.3+0.6;
    ctx.lineWidth=1.4;
    let prev=null;
    for(let i=0;i<=RING;i++){
      const q=rot(ring[i%RING],rax,ray),P=proj(q);
      if(prev){
        const dep=1-((q[2]+prev[3])/2/1.5+1)/2;
        ctx.strokeStyle='rgba('+rgb+','+((0.08+0.42*Math.max(0,Math.min(1,dep)))*k).toFixed(3)+')';
        ctx.beginPath();ctx.moveTo(prev[0],prev[1]);ctx.lineTo(P[0],P[1]);ctx.stroke();
      }
      prev=P;
    }
    // ماهواره‌ی روی حلقه
    const sa=t*0.0006, sat=rot([Math.cos(sa)*1.5,0,Math.sin(sa)*1.5],rax,ray), SP=proj(sat);
    ctx.fillStyle='rgba('+(dark?'255,214,90':'230,150,20')+','+(0.95*k).toFixed(3)+')';
    ctx.beginPath();ctx.arc(SP[0],SP[1],3.2*SP[2],0,6.283);ctx.fill();
    ctx.fillStyle='rgba('+(dark?'255,214,90':'230,150,20')+','+(0.2*k).toFixed(3)+')';
    ctx.beginPath();ctx.arc(SP[0],SP[1],10*SP[2],0,6.283);ctx.fill();
  }

  let raf=0,last=0;
  function loop(ts){
    raf=requestAnimationFrame(loop);
    if(mobile&&ts-last<33)return;       // موبایل: ~۳۰ فریم بر ثانیه
    const dt=last?Math.min(50,ts-last):16; last=ts;
    ay+=dt*0.00018;
    draw(ts);
  }
  function start(){if(!reduce&&!raf){last=0;raf=requestAnimationFrame(loop)}}
  function stop(){if(raf){cancelAnimationFrame(raf);raf=0}}
  document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
  addEventListener('resize',resize);
  resize();
  if(reduce)draw(0);else start();
  // با تغییر تم یک‌بار دوباره رسم می‌شود (برای حالت کاهش حرکت)
  new MutationObserver(()=>{if(reduce)draw(0)}).observe(root,{attributes:true,attributeFilter:['data-theme']});

  // ---- ماوس: پارالکس صحنه و لوگو ----
  let pending=false,px=0,py=0;
  addEventListener('pointermove',e=>{
    if(e.pointerType==='touch')return;
    px=e.clientX/W*2-1;py=e.clientY/H*2-1;
    if(!pending){pending=true;requestAnimationFrame(()=>{
      pending=false;mx=px;my=py;
      root.style.setProperty('--px',px.toFixed(3));root.style.setProperty('--py',py.toFixed(3));
    })}
  },{passive:true});

  // ---- تیلت سه‌بعدی پیشنهادها ----
  if(matchMedia('(hover:hover)').matches&&!reduce){
    let cur=null;
    const reset=b=>{if(!b)return;b.style.setProperty('--rx','0deg');b.style.setProperty('--ry','0deg')};
    document.addEventListener('pointermove',e=>{
      const b=e.target.closest?e.target.closest('.sug button'):null;
      if(cur&&cur!==b){reset(cur);cur=null}
      if(!b)return;cur=b;
      const r=b.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      b.style.setProperty('--ry',(x*16).toFixed(2)+'deg');
      b.style.setProperty('--rx',(-y*12).toFixed(2)+'deg');
      b.style.setProperty('--mx',((x+.5)*100).toFixed(1)+'%');
      b.style.setProperty('--my',((y+.5)*100).toFixed(1)+'%');
    },{passive:true});
    document.addEventListener('pointerleave',()=>{reset(cur);cur=null});
  }
})();
</script>
